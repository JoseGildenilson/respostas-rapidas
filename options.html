<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Respostas Rápidas</title>
  <style>
    body { max-width: 760px; margin: 24px auto; padding: 0 16px; font: 15px/1.4 system-ui, sans-serif; color: #222; }
    h1 { font-size: 20px; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; }
    input[type=text], textarea { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; border: 1px solid #bbb; border-radius: 6px; }
    textarea { min-height: 110px; resize: vertical; }
    button { padding: 7px 14px; margin: 10px 6px 0 0; cursor: pointer; }
    .item { border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
    .item .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .item .t { font-weight: 600; }
    .item .p { color: #555; white-space: pre-wrap; margin: 4px 0 6px; max-height: 4.2em; overflow: hidden; }
    .row { margin-top: 24px; }
    #msg { color: #2a7; margin-left: 8px; }
    .shortcut-wrap { display: flex; gap: 8px; align-items: center; }
    .shortcut-wrap input { flex: 1; cursor: pointer; background: #fafafa; }
    .shortcut-wrap input:focus { background: #eef6ff; border-color: #2563eb; outline: none; }
    .shortcut-wrap button { margin: 0; }
    .hint { font-size: 12.5px; color: #555; margin-top: 4px; }
    .err { font-size: 12.5px; color: #c62828; margin-top: 4px; }
    kbd.rr-kbd { display: inline-block; padding: 2px 6px; font: 600 12px/1.2 ui-monospace, SFMono-Regular, monospace; background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; border-radius: 4px; white-space: nowrap; }
  </style>
</head>
<body>
  <h1>Respostas Rápidas</h1>

  <label for="title">Título (usado na busca)</label>
  <input type="text" id="title" placeholder="Ex.: Reiniciar roteador">

  <label for="text">Mensagem</label>
  <textarea id="text" placeholder="Texto que será inserido no chat"></textarea>

  <label for="shortcut">Atalho de teclado (opcional)</label>
  <div class="shortcut-wrap">
    <input type="text" id="shortcut" readonly placeholder="Clique aqui e pressione o atalho (ex.: Alt + Shift + 1)">
    <button type="button" id="clearShortcut">Limpar</button>
  </div>
  <div class="hint">Recomendado: <strong>Alt + Shift + número/letra</strong> ou <strong>Ctrl + Shift + número</strong>. Atalhos reservados do navegador são bloqueados automaticamente.</div>
  <div id="shortcutErr" class="err" hidden></div>

  <button id="save">Salvar</button>
  <button id="cancel" hidden>Cancelar edição</button>
  <span id="msg"></span>

  <div class="row">
    <strong>Mensagens salvas (<span id="count">0</span>)</strong>
    <div id="list"></div>
  </div>

  <div class="row">
    <button id="export">Exportar JSON</button>
    <button id="import">Importar JSON</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>

  <script src="options.js"></script>
</body>
</html>
